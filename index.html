<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />
    <title>Controle Financeiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f3f5fb;
        --bg2: #e9edf8;
        --card: #fff;
        --tx: #0f1730;
        --mut: #66708f;
        --bd: #e4e8f3;
        --pri: #5b5bf0;
        --pri2: #8b5cf6;
        --ok: #10b981;
        --bad: #ef4444;
        --warn: #f59e0b;
        --sh: 0 8px 30px rgba(30, 40, 90, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b1020;
          --bg2: #10172c;
          --card: #151d36;
          --tx: #eef1ff;
          --mut: #97a0c4;
          --bd: #232d4d;
          --sh: 0 8px 30px rgba(0, 0, 0, 0.35);
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b1020;
        --bg2: #10172c;
        --card: #151d36;
        --tx: #eef1ff;
        --mut: #97a0c4;
        --bd: #232d4d;
        --sh: 0 8px 30px rgba(0, 0, 0, 0.35);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background:
          radial-gradient(
            900px 500px at 80% -10%,
            rgba(91, 91, 240, 0.18),
            transparent
          ),
          var(--bg);
        color: var(--tx);
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        line-height: 1.45;
        min-height: 100vh;
      }
      .hide {
        display: none !important;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      .shell {
        max-width: 560px;
        margin: 0 auto;
        padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px
          calc(env(safe-area-inset-bottom, 0px) + 100px);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      header h1 {
        font-size: 22px;
        margin: 0;
        letter-spacing: -0.5px;
        font-weight: 800;
      }
      header p {
        margin: 0;
        color: var(--mut);
        font-size: 13px;
      }
      .ibtn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        border: 1px solid var(--bd);
        background: var(--card);
        color: var(--tx);
        display: grid;
        place-items: center;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 20px;
        padding: 18px;
        margin-bottom: 14px;
        box-shadow: var(--sh);
        animation: up 0.35s ease both;
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .hero {
        background: linear-gradient(135deg, var(--pri), var(--pri2));
        color: #fff;
        border: 0;
        display: flex;
        align-items: center;
        gap: 16px;
        position: relative;
        overflow: hidden;
      }
      .hero:after {
        content: "";
        position: absolute;
        right: -60px;
        top: -60px;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
      }
      .ring {
        position: relative;
        width: 112px;
        height: 112px;
        flex: none;
      }
      .ring svg {
        transform: rotate(-90deg);
      }
      .ring b {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 800;
      }
      .hero .l {
        font-size: 12px;
        opacity: 0.85;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        font-weight: 600;
      }
      .hero .n {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -1.2px;
        line-height: 1.1;
      }
      .hero .s {
        font-size: 13px;
        opacity: 0.9;
        margin-top: 4px;
      }
      .k {
        font-size: 11.5px;
        color: var(--mut);
        text-transform: uppercase;
        letter-spacing: 0.6px;
        font-weight: 600;
      }
      .v {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.6px;
        margin-top: 2px;
      }
      .g2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .g2 .card {
        margin: 0;
      }
      .gap {
        margin-bottom: 14px;
      }
      .pos {
        color: var(--ok);
      }
      .neg {
        color: var(--bad);
      }
      .pill {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        padding: 4px 9px;
        border-radius: 99px;
      }
      .pill.ok {
        background: rgba(16, 185, 129, 0.15);
        color: var(--ok);
      }
      .pill.bad {
        background: rgba(239, 68, 68, 0.15);
        color: var(--bad);
      }
      .pill.warn {
        background: rgba(245, 158, 11, 0.18);
        color: var(--warn);
      }
      .pill.mut {
        background: var(--bg2);
        color: var(--mut);
      }
      .bar {
        height: 9px;
        background: var(--bg2);
        border-radius: 99px;
        overflow: hidden;
        margin-top: 10px;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, var(--ok), #34d399);
        transition: width 0.6s;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 13px 0;
        border-bottom: 1px solid var(--bd);
      }
      .row:last-child {
        border: 0;
        padding-bottom: 0;
      }
      .row:first-of-type {
        padding-top: 8px;
      }
      .t {
        font-weight: 600;
        font-size: 15px;
      }
      .d {
        font-size: 12.5px;
        color: var(--mut);
      }
      .sec {
        font-size: 15px;
        font-weight: 700;
        margin: 6px 2px 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--mut);
        margin: 14px 0 6px;
      }
      input,
      select {
        width: 100%;
        padding: 14px;
        border-radius: 14px;
        border: 1.5px solid var(--bd);
        background: var(--bg);
        color: var(--tx);
        font:
          600 16px Inter,
          sans-serif;
        outline: 0;
        transition: border 0.15s;
      }
      input:focus {
        border-color: var(--pri);
      }
      .f2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .big {
        font-size: 30px !important;
        font-weight: 800 !important;
        letter-spacing: -1px;
        padding: 16px !important;
      }
      .btn {
        width: 100%;
        border: 0;
        border-radius: 16px;
        padding: 16px;
        margin-top: 18px;
        font-size: 16px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, var(--pri), var(--pri2));
        box-shadow: 0 8px 20px rgba(91, 91, 240, 0.35);
        transition: transform 0.1s;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn.g {
        background: var(--bg2);
        color: var(--tx);
        box-shadow: none;
      }
      .sm {
        border: 0;
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 12.5px;
        font-weight: 700;
        background: var(--bg2);
        color: var(--tx);
      }
      .sm.ok {
        background: rgba(16, 185, 129, 0.15);
        color: var(--ok);
      }
      .x {
        border: 0;
        background: none;
        color: var(--bad);
        font-size: 20px;
        padding: 4px 8px;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .chip {
        border: 1.5px solid var(--bd);
        background: var(--card);
        color: var(--tx);
        border-radius: 99px;
        padding: 7px 13px;
        font-size: 13px;
        font-weight: 600;
      }
      .chip.on {
        background: var(--pri);
        border-color: var(--pri);
        color: #fff;
      }
      .chart {
        display: flex;
        align-items: flex-end;
        gap: 5px;
        height: 120px;
        margin-top: 14px;
        position: relative;
      }
      .chart .c {
        flex: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        font-size: 10px;
        color: var(--mut);
        gap: 3px;
      }
      .chart .c i {
        display: block;
        width: 100%;
        border-radius: 6px 6px 0 0;
        background: var(--pri);
        opacity: 0.85;
        min-height: 3px;
      }
      .chart .c i.hit {
        background: var(--ok);
      }
      .goal {
        position: absolute;
        left: 0;
        right: 0;
        border-top: 1.5px dashed var(--warn);
        font-size: 10px;
        color: var(--warn);
        text-align: right;
      }
      .empty {
        text-align: center;
        color: var(--mut);
        padding: 26px 8px;
        font-size: 14px;
      }
      .empty .e {
        font-size: 34px;
      }
      .note {
        font-size: 12.5px;
        color: var(--mut);
        margin-top: 10px;
      }
      nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        background: color-mix(in srgb, var(--card) 88%, transparent);
        backdrop-filter: blur(14px);
        border-top: 1px solid var(--bd);
        padding: 8px 10px calc(env(safe-area-inset-bottom, 0px) + 8px);
      }
      nav div {
        max-width: 560px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        align-items: end;
      }
      nav button {
        border: 0;
        background: none;
        color: var(--mut);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        font-weight: 600;
        padding: 6px 0;
      }
      nav button.on {
        color: var(--pri);
      }
      nav button.plus span {
        width: 52px;
        height: 52px;
        margin-top: -26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #fff;
        background: linear-gradient(135deg, var(--pri), var(--pri2));
        box-shadow: 0 8px 20px rgba(91, 91, 240, 0.45);
      }
      nav svg,
      .ibtn svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
        transform: translate(-50%, 20px);
        background: #111827;
        color: #fff;
        padding: 12px 18px;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transition: 0.3s;
        z-index: 50;
        max-width: 90%;
      }
      #toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .login {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .login .box {
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 22px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        font-size: 34px;
        background: linear-gradient(135deg, var(--pri), var(--pri2));
        box-shadow: 0 14px 34px rgba(91, 91, 240, 0.45);
      }
      .login h1 {
        margin: 0 0 4px;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.8px;
      }
      .login p {
        color: var(--mut);
        margin: 0 0 22px;
      }
      .login .card {
        text-align: left;
      }
      .pw {
        position: relative;
      }
      .pw button {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        border: 0;
        background: none;
        color: var(--mut);
        font-size: 12.5px;
        font-weight: 700;
        padding: 8px;
      }
      .err {
        color: var(--bad);
        font-size: 13.5px;
        font-weight: 600;
        margin-top: 12px;
        min-height: 18px;
        text-align: center;
      }
      .seg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: var(--bg2);
        border-radius: 14px;
        padding: 4px;
        gap: 4px;
      }
      .seg button {
        border: 0;
        border-radius: 10px;
        padding: 12px;
        font-weight: 700;
        background: none;
        color: var(--mut);
        font-size: 15px;
      }
      .seg button.in.on {
        background: var(--ok);
        color: #fff;
      }
      .seg button.out.on {
        background: var(--bad);
        color: #fff;
      }
      .alert {
        border-radius: 16px;
        padding: 14px 16px;
        margin-bottom: 12px;
        font-weight: 600;
        font-size: 14px;
        display: flex;
        gap: 12px;
        align-items: center;
        animation: up 0.3s both;
        cursor: pointer;
      }
      .alert.bad {
        background: rgba(239, 68, 68, 0.14);
        color: var(--bad);
        border: 1px solid rgba(239, 68, 68, 0.4);
      }
      .alert.warn {
        background: rgba(245, 158, 11, 0.15);
        color: var(--warn);
        border: 1px solid rgba(245, 158, 11, 0.4);
      }
      .chk {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2.5px solid var(--bd);
        background: none;
        flex: none;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 17px;
        font-weight: 800;
        padding: 0;
      }
      .chk.on {
        background: var(--ok);
        border-color: var(--ok);
      }
      .chk.bad {
        border-color: var(--bad);
      }
      .chk.warn {
        border-color: var(--warn);
      }
      .conta {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 12px;
        border-radius: 16px;
        margin-bottom: 9px;
        background: var(--card);
        border: 1px solid var(--bd);
        border-left: 5px solid var(--bd);
        animation: up 0.3s both;
      }
      .conta.bad {
        border-left-color: var(--bad);
        background: rgba(239, 68, 68, 0.08);
      }
      .conta.warn {
        border-left-color: var(--warn);
      }
      .conta.ok {
        border-left-color: var(--ok);
        opacity: 0.7;
      }
      select {
        appearance: none;
        -webkit-appearance: none;
      }
      .sw {
        text-align: center;
        margin-top: 16px;
        color: var(--mut);
        font-size: 14px;
        cursor: pointer;
      }
      .sw b {
        color: var(--pri);
      }
      .kpis {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 14px;
      }
      .kpis .card {
        margin: 0;
      }
      .narrow {
        max-width: 560px;
        margin: 0 auto;
      }
      .brand {
        display: none;
        margin: 0;
      }
      @media (min-width: 700px) {
        .shell {
          max-width: 780px;
        }
      }
      @media (min-width: 1024px) {
        body {
          padding-left: 250px;
        }
        .shell {
          max-width: 1240px;
          padding: 34px 36px 40px;
        }
        header h1 {
          font-size: 28px;
        }
        nav {
          top: 0;
          bottom: 0;
          right: auto;
          width: 250px;
          border-top: 0;
          border-right: 1px solid var(--bd);
          padding: 26px 14px;
          background: var(--card);
          backdrop-filter: none;
        }
        .brand {
          display: flex;
          align-items: center;
          gap: 10px;
          font-weight: 800;
          font-size: 17px;
          line-height: 1.15;
          padding: 4px 10px 24px;
        }
        nav #nav {
          display: flex;
          flex-direction: column;
          gap: 4px;
          max-width: none;
          margin: 0;
        }
        nav button {
          flex-direction: row;
          justify-content: flex-start;
          gap: 12px;
          font-size: 15px;
          padding: 12px 14px;
          border-radius: 12px;
        }
        nav button:hover,
        nav button.on {
          background: var(--bg2);
        }
        nav button.plus {
          order: -1;
          background: linear-gradient(135deg, var(--pri), var(--pri2));
          color: #fff;
          margin-bottom: 12px;
          box-shadow: 0 8px 20px rgba(91, 91, 240, 0.35);
        }
        nav button.plus:hover {
          background: linear-gradient(135deg, var(--pri), var(--pri2));
        }
        nav button.plus span {
          width: auto;
          height: auto;
          margin: 0;
          background: none;
          box-shadow: none;
          border-radius: 0;
          display: flex;
        }
        .g12 {
          display: grid;
          grid-template-columns: repeat(12, 1fr);
          gap: 16px;
          align-items: start;
        }
        .g12 > * {
          margin: 0 !important;
        }
        .s12 {
          grid-column: span 12;
        }
        .s8 {
          grid-column: span 8;
        }
        .s7 {
          grid-column: span 7;
        }
        .s6 {
          grid-column: span 6;
        }
        .s5 {
          grid-column: span 5;
        }
        .s4 {
          grid-column: span 4;
        }
        .o2 {
          order: 2;
        }
        .kpis {
          grid-template-columns: repeat(4, 1fr);
          gap: 16px;
        }
        .mob {
          display: none !important;
        }
        .chart {
          height: 190px;
        }
        .hero .n {
          font-size: 44px;
        }
        #toast {
          bottom: 28px;
        }
      }
      button:focus:not(:focus-visible) {
        outline: none;
      }
      nav button:focus-visible {
        outline: 2px solid var(--pri);
        outline-offset: -2px;
      }
      .dsk {
        display: none;
      }
      @media (min-width: 700px) {
        .kpis {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      @media (min-width: 1024px) and (max-width: 1279px) {
        body {
          padding-left: 220px;
        }
        nav {
          width: 220px;
        }
        .shell {
          padding: 28px 24px 40px;
        }
        .s7,
        .s5,
        .s8,
        .s4 {
          grid-column: span 12;
        }
        .o2 {
          order: 0;
        }
        .narrow .s6 {
          grid-column: span 12;
        }
        .mob {
          display: block !important;
        }
      }
      @media (min-width: 1280px) {
        .narrow {
          max-width: none;
        }
        .dsk {
          display: block;
        }
      }
      @media (min-width: 1536px) {
        .shell {
          max-width: 1380px;
        }
        .hero .n {
          font-size: 52px;
        }
        .v {
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <div id="login" class="login hide">
      <div class="box">
        <div class="logo">💰</div>
        <h1>Controle Financeiro</h1>
        <p>Entradas, saídas e contas em dia. Feito para motoristas de app.</p>
        <div class="card">
          <div id="nmw" class="hide">
            <label style="margin-top: 0">Seu nome</label
            ><input
              id="nm"
              placeholder="Como quer ser chamado"
              autocomplete="name"
            />
          </div>
          <label id="lbe">E-mail</label
          ><input
            id="em"
            type="email"
            placeholder="seu@email.com"
            autocomplete="email"
          />
          <label>Senha</label>
          <div class="pw">
            <input
              id="pw"
              type="password"
              placeholder="Sua senha"
              autocomplete="current-password"
            /><button id="eye" type="button">mostrar</button>
          </div>
          <button class="btn" id="enter">Entrar</button>
          <div class="err" id="err"></div>
          <div class="sw" id="sw">Ainda não tem conta? <b>Criar agora</b></div>
        </div>
      </div>
    </div>

    <div id="app" class="hide">
      <div class="shell">
        <header>
          <div>
            <h1 id="hi">Olá</h1>
            <p id="dt"></p>
          </div>
          <button class="ibtn" id="theme" aria-label="Tema">
            <svg viewBox="0 0 24 24">
              <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" />
            </svg>
          </button>
        </header>
        <main id="view"></main>
      </div>
      <nav>
        <p class="brand">
          💰 <span>Controle<br />Financeiro</span>
        </p>
        <div id="nav">
          <button data-t="i" class="on">
            <svg viewBox="0 0 24 24">
              <path
                d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"
              /></svg
            >Início
          </button>
          <button data-t="c">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="3" />
              <path d="M3 10h18" /></svg
            >Contas
          </button>
          <button data-t="l" class="plus">
            <span
              ><svg viewBox="0 0 24 24" style="stroke: #fff">
                <path d="M12 5v14M5 12h14" /></svg></span
            >Lançar
          </button>
          <button data-t="h">
            <svg viewBox="0 0 24 24">
              <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg
            >Extrato
          </button>
          <button data-t="g">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"
              /></svg
            >Ajustes
          </button>
        </div>
      </nav>
    </div>
    <div id="toast"></div>

    <script>
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s == null ? "" : s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const fmt = (n) => {
        n = Number(n) || 0;
        return (
          (n < 0 ? "-" : "") +
          "R$ " +
          Math.abs(n).toLocaleString("pt-BR", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          })
        );
      };
      const fm0 = (n) => {
        n = Number(n) || 0;
        return (
          (n < 0 ? "-" : "") +
          "R$ " +
          Math.abs(Math.round(n)).toLocaleString("pt-BR")
        );
      };
      const iso = (d) => {
        const z = new Date(d.getTime() - d.getTimezoneOffset() * 6e4);
        return z.toISOString().slice(0, 10);
      };
      const br = (s) => {
        const p = String(s).split("-");
        return p[2] + "/" + p[1];
      };
      const dayDiff = (a, b) =>
        Math.round(
          (new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5,
        );
      const addMonths = (s, n) => {
        const [y, m, d] = s.split("-").map(Number);
        const t = new Date(y, m - 1 + n, 1);
        const l = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
        t.setDate(Math.min(d, l));
        return iso(t);
      };
      const WD = [
        "domingo",
        "segunda",
        "terça",
        "quarta",
        "quinta",
        "sexta",
        "sábado",
      ];
      const CIN = ["🚗 Corridas", "💵 Gorjeta / bônus", "➕ Outras entradas"];
      const COUT = [
        "⛽ Combustível",
        "🍔 Alimentação",
        "🛠️ Manutenção",
        "🛡️ Seguro",
        "🚘 Carro (aluguel/parcela)",
        "🏠 Casa / aluguel",
        "💳 Fatura de cartão",
        "📱 Celular / internet",
        "🏋️ Academia",
        "🧾 Outras contas",
      ];
      const DEF = { gastoDia: 0, margem: 0, saldo0: 0 };
      let items = [],
        tab = "i",
        TOKEN = null,
        USER = "",
        filtro = "a",
        showForm = false,
        per = "m",
        tipo = "entrada",
        modo = "login";
      const TK = "ctrl_fin_token_v2";
      const cfg = () =>
        Object.assign({}, DEF, items.find((i) => i.id === "cfg") || {});
      const cats = (t) => {
        const c = cfg();
        return (
          (t === "entrada" ? c.catsIn : c.catsOut) ||
          (t === "entrada" ? CIN : COUT)
        );
      };
      const opts = (t, sel) =>
        cats(t)
          .map(
            (c) => `<option ${c === sel ? "selected" : ""}>${esc(c)}</option>`,
          )
          .join("") + `<option value="__new">➕ Nova categoria…</option>`;
      const by = (t) => items.filter((i) => i.type === t);
      const uid = () =>
        "x" +
        Date.now().toString(36) +
        Math.floor(Math.random() * 1e5).toString(36);
      const sum = (a, k) => a.reduce((s, x) => s + (+x[k] || 0), 0);
      const toast = (m) => {
        const t = $("#toast");
        t.textContent = m;
        t.classList.add("on");
        clearTimeout(toast.h);
        toast.h = setTimeout(() => t.classList.remove("on"), 2600);
      };

      /* ---------- API ---------- */
      function api(m, p, b) {
        return fetch("api.php?r=" + p, {
          method: m,
          headers: Object.assign(
            { "Content-Type": "application/json" },
            TOKEN ? { "X-Token": TOKEN } : {},
          ),
          body: b ? JSON.stringify(b) : undefined,
        }).then(async (r) => {
          if (r.status === 401 && TOKEN && p !== "login") {
            logout("Sessão expirada. Entre de novo.");
            throw new Error("401");
          }
          if (!r.ok) {
            let j = {};
            try {
              j = await r.json();
            } catch (_) {}
            const e = new Error(j.error || r.status);
            e.status = r.status;
            e.msg = j.error;
            throw e;
          }
          return r.json();
        });
      }
      function save(id, o) {
        const i = items.findIndex((x) => x.id === id),
          rec = Object.assign({ id }, o);
        if (i >= 0) items[i] = rec;
        else items.push(rec);
        draw();
        return api("PUT", "items/" + encodeURIComponent(id), o).catch(() =>
          toast("Não consegui salvar. Confira a conexão."),
        );
      }
      function del(id) {
        items = items.filter((x) => x.id !== id);
        draw();
        return api("DELETE", "items/" + encodeURIComponent(id)).catch(() =>
          toast("Erro ao excluir."),
        );
      }
      function saveCfg(p) {
        const c = cfg();
        delete c.id;
        save("cfg", Object.assign({}, c, p, { type: "cfg" }));
      }
      function addCat(t) {
        const n = (
          prompt("Nome da nova categoria (pode começar com um emoji):") || ""
        ).trim();
        if (!n) return null;
        const l = cats(t).slice();
        if (l.indexOf(n) < 0) l.push(n);
        saveCfg(t === "entrada" ? { catsIn: l } : { catsOut: l });
        return n;
      }

      /* ---------- cálculo ---------- */
      function st(x, hoje) {
        if (x.pago) return { k: "ok", t: "Pago" };
        const d = dayDiff(hoje, x.venc);
        if (d < 0)
          return {
            k: "bad",
            t: "Atrasada há " + -d + (d === -1 ? " dia" : " dias"),
          };
        if (d === 0) return { k: "warn", t: "Vence hoje" };
        return {
          k: d <= 3 ? "warn" : "mut",
          t: "Vence em " + d + (d === 1 ? " dia" : " dias"),
        };
      }
      function calc() {
        const c = cfg(),
          hoje = iso(new Date()),
          movs = by("mov"),
          contas = by("conta");
        const ent = movs.filter((m) => m.tipo === "entrada"),
          sai = movs.filter((m) => m.tipo === "saida");
        const saldo = (+c.saldo0 || 0) + sum(ent, "valor") - sum(sai, "valor");
        const eh = sum(
            ent.filter((m) => m.date === hoje),
            "valor",
          ),
          sh = sum(
            sai.filter((m) => m.date === hoje && !m.ref),
            "valor",
          );
        const base = saldo - (eh - sh);
        const pend = contas
          .filter((x) => !x.pago)
          .sort((a, b) => (a.venc < b.venc ? -1 : 1));
        let cum = 0,
          meta = 0;
        const seq = pend.map((x) => {
          cum += +x.valor || 0;
          meta = Math.max(
            meta,
            (cum - base) / Math.max(1, dayDiff(hoje, x.venc)),
          );
          return { x, dd: dayDiff(hoje, x.venc), cum, cobre: saldo >= cum };
        });
        const guardar = Math.ceil(Math.max(0, meta)) + (+c.margem || 0),
          gd = +c.gastoDia || 0;
        const mes = hoje.slice(0, 7),
          em = ent.filter((m) => m.date.slice(0, 7) === mes),
          sm = sai.filter((m) => m.date.slice(0, 7) === mes);
        const porDia = {};
        ent.forEach((m) => {
          porDia[m.date] = (porDia[m.date] || 0) + (+m.valor || 0);
        });
        let streak = 0,
          k = new Date();
        if (!porDia[iso(k)]) k.setDate(k.getDate() - 1);
        while (porDia[iso(k)]) {
          streak++;
          k.setDate(k.getDate() - 1);
        }
        return {
          c,
          hoje,
          saldo,
          pend,
          seq,
          guardar,
          gd,
          bruto: pend.length ? guardar + gd : 0,
          feito: eh,
          aPagar: sum(pend, "valor"),
          over: pend.filter((x) => x.venc < hoje),
          hojeV: pend.filter((x) => x.venc === hoje),
          soon: pend.filter((x) => {
            const d = dayDiff(hoje, x.venc);
            return d >= 1 && d <= 2;
          }),
          mEnt: sum(em, "valor"),
          mSai: sum(sm, "valor"),
          porDia,
          streak,
        };
      }

      /* ---------- telas ---------- */
      function vInicio() {
        const m = calc(),
          pct = m.bruto ? Math.min(1, m.feito / m.bruto) : 0,
          R = 48,
          C = 2 * Math.PI * R,
          falta = Math.max(0, m.bruto - m.feito);
        let h = `<div class="g12"><div class="s12">`;
        if (m.over.length)
          h += `<div class="alert bad" data-go="c"><span style="font-size:22px">⚠️</span><div>${m.over.length === 1 ? "1 conta atrasada" : m.over.length + " contas atrasadas"} · ${fmt(sum(m.over, "valor"))}<div class="d" style="color:inherit;opacity:.85">${m.over
            .slice(0, 3)
            .map((x) => esc(x.nome))
            .join(", ")}</div></div></div>`;
        if (m.hojeV.length)
          h += `<div class="alert warn" data-go="c"><span style="font-size:22px">🔔</span><div>Vence hoje: ${m.hojeV.map((x) => esc(x.nome)).join(", ")}</div></div>`;
        if (m.soon.length)
          h += `<div class="alert warn" data-go="c"><span style="font-size:22px">⏰</span><div>Vence nos próximos 2 dias: ${m.soon.map((x) => esc(x.nome)).join(", ")}</div></div>`;
        h += "</div>";
        if (m.pend.length)
          h += `<div class="card hero ${m.seq.length ? "s7" : "s12"}"><div class="ring"><svg width="112" height="112" viewBox="0 0 112 112"><circle cx="56" cy="56" r="${R}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="10"/><circle cx="56" cy="56" r="${R}" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" style="transition:stroke-dashoffset .8s"/></svg><b>${Math.round(pct * 100)}%</b></div>
    <div style="position:relative"><div class="l">Para ficar em dia, ganhe hoje</div><div class="n">${fm0(m.bruto)}</div><div class="s">${falta > 0 ? "Faltam " + fm0(falta) + " · já entrou " + fm0(m.feito) : "Meta batida! O que passar disso é folga 🎉"}</div></div></div>`;
        else
          h += `<div class="card hero ${m.seq.length ? "s7" : "s12"}"><div style="position:relative"><div class="l">Tudo em dia</div><div class="n">Sem contas pendentes</div><div class="s">Cadastre suas obrigações em Contas.</div></div></div>`;
        const n = m.seq[0];
        if (n) {
          const p = Math.min(1, Math.max(0, m.saldo / n.cum));
          h += `<div class="card s5"><div class="k">Próxima conta</div><div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:4px"><div><div class="t" style="font-size:17px">${esc(n.x.nome)}</div><div class="d">${br(n.x.venc)} · ${st(n.x, m.hoje).t}</div></div><div class="v">${fm0(n.x.valor)}</div></div><div class="bar"><i style="width:${p * 100}%"></i></div><div class="d" style="margin-top:6px">${n.cobre ? "✅ O saldo já cobre" : "Saldo cobre " + Math.round(p * 100) + "% · faltam " + fm0(n.cum - m.saldo)}</div></div>`;
        }
        h += `<div class="kpis s12"><div class="card"><div class="k">Saldo</div><div class="v ${m.saldo < 0 ? "neg" : "pos"}">${fm0(m.saldo)}</div></div><div class="card"><div class="k">A pagar</div><div class="v">${fm0(m.aPagar)}</div></div><div class="card"><div class="k">Entrou no mês</div><div class="v pos">${fm0(m.mEnt)}</div></div><div class="card"><div class="k">Saiu no mês</div><div class="v neg">${fm0(m.mSai)}</div><div class="d">sobrou ${fm0(m.mEnt - m.mSai)}</div></div></div>`;
        const last = [],
          t0 = new Date();
        t0.setHours(12, 0, 0, 0);
        for (let i = 13; i >= 0; i--) {
          const dd = new Date(t0.getTime() - i * 864e5),
            k = iso(dd);
          last.push({
            k,
            v: m.porDia[k] || 0,
            w: WD[dd.getDay()][0].toUpperCase(),
          });
        }
        const mx = Math.max(m.bruto, ...last.map((x) => x.v), 1);
        h += `<div class="card s7"><div class="sec" style="margin:0"><span>Entradas dos últimos 14 dias</span><span class="pill mut">${m.streak ? "🔥 " + m.streak + (m.streak > 1 ? " dias" : " dia") : "sem sequência"}</span></div><div class="chart">${m.bruto ? `<div class="goal" style="bottom:calc(${(m.bruto / mx) * 85}% + 16px)">meta</div>` : ""}${last.map((x) => `<div class="c"><i class="${m.bruto && x.v >= m.bruto ? "hit" : ""}" style="height:${(x.v / mx) * 85}%" title="${fmt(x.v)}"></i>${x.w}<br>${x.k.slice(8)}</div>`).join("")}</div></div>`;
        h +=
          `<div class="card s5"><div class="k">Fila de vencimentos</div>` +
          (m.seq.length
            ? m.seq
                .slice(0, 6)
                .map(
                  (q) =>
                    `<div class="row"><div><div class="t">${esc(q.x.nome)}</div><div class="d">${br(q.x.venc)} · ${st(q.x, m.hoje).t}</div></div><div style="text-align:right"><div class="t">${fm0(q.x.valor)}</div><span class="pill ${q.cobre ? "ok" : q.dd < 0 ? "bad" : "warn"}">${q.cobre ? "coberta" : "falta " + fm0(q.cum - m.saldo)}</span></div></div>`,
                )
                .join("")
            : `<div class="empty"><div class="e">✅</div>Nenhuma conta pendente</div>`) +
          `</div>`;
        return h + "</div>";
      }

      function recentMov() {
        const l = by("mov")
          .slice()
          .reverse()
          .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0))
          .slice(0, 7);
        return (
          `<div class="card"><div class="k">Últimos lançamentos</div>` +
          (l.length
            ? l
                .map((m) => {
                  const en = m.tipo === "entrada";
                  return `<div class="row"><div><div class="t">${esc(m.cat || "")}</div><div class="d">${br(m.date)}${m.desc ? " · " + esc(m.desc) : ""}</div></div><b class="${en ? "pos" : "neg"}">${en ? "+" : "−"}${fmt(m.valor)}</b></div>`;
                })
                .join("")
            : `<div class="empty"><div class="e">📒</div>Nada lançado ainda.</div>`) +
          `</div>`
        );
      }
      function vLancar() {
        const e = tipo === "entrada";
        return `<div class="narrow g12"><div class="s6"><div class="card"><div class="seg"><button class="in ${e ? "on" : ""}" data-tipo="entrada">＋ Entrada</button><button class="out ${e ? "" : "on"}" data-tipo="saida">－ Saída</button></div>
  <input id="mv" class="big" type="number" inputmode="decimal" step="0.01" placeholder="0,00" style="margin-top:16px">
  <label>Categoria</label><select id="mc" data-t="${tipo}">${opts(tipo)}</select>
  <label>Descrição (opcional)</label><input id="md" placeholder="${e ? "Ex.: Uber, 99, inDrive" : "Ex.: Gasolina posto Shell"}">
  <label>Data</label><input id="mdt" type="date" value="${iso(new Date())}"></div>
  <button class="btn" id="ls" style="background:var(--${e ? "ok" : "bad"})">Salvar ${e ? "entrada" : "saída"}</button></div><div class="s6 dsk">${recentMov()}</div></div>`;
      }

      function vContas() {
        const hoje = iso(new Date()),
          all = by("conta").sort((a, b) => (a.venc < b.venc ? -1 : 1));
        const list = all.filter((x) =>
          filtro === "a" ? !x.pago : filtro === "p" ? x.pago : true,
        );
        const sf = showForm || innerWidth >= 1280;
        let h = `<div class="g12"><div class="s4 o2"><button class="btn mob" id="tf" style="margin:0 0 14px">${showForm ? "Fechar" : "＋ Nova conta / obrigação"}</button>`;
        if (sf)
          h += `<div class="card"><div class="k">Nova obrigação</div><label>Nome</label><input id="cn" placeholder="Ex.: Seguro do carro, academia, fatura Nubank">
  <div class="f2"><div><label>Valor</label><input id="cv" type="number" inputmode="decimal" step="0.01" placeholder="0,00"></div><div><label>Vencimento</label><input id="cd" type="date"></div></div>
  <label>Categoria</label><select id="cc" data-t="saida">${opts("saida", "🧾 Outras contas")}</select>
  <label>Repetir por quantos meses? (1 = só esta vez)</label><input id="cx" type="number" min="1" max="60" value="1"><button class="btn" id="ca">Adicionar</button></div>`;
        h += `</div><div class="s8"><div class="sec"><span>Checklist</span><div class="chips" style="margin:0">${[
          ["a", "Abertas"],
          ["p", "Pagas"],
          ["t", "Todas"],
        ]
          .map(
            ([k, n]) =>
              `<button class="chip ${filtro === k ? "on" : ""}" data-f="${k}">${n}</button>`,
          )
          .join("")}</div></div>`;
        if (!list.length)
          h += `<div class="card"><div class="empty"><div class="e">🧾</div>${all.length ? "Nada nesta lista." : "Nenhuma conta ainda. Toque em “Nova conta” para começar."}</div></div>`;
        list.forEach((x) => {
          const s = st(x, hoje);
          h += `<div class="conta ${s.k}"><button class="chk ${x.pago ? "on" : s.k}" data-pay="${esc(x.id)}" aria-label="Marcar como paga">${x.pago ? "✓" : ""}</button>
  <div style="flex:1;min-width:0"><div class="t" style="${x.pago ? "text-decoration:line-through" : ""}">${esc(x.nome)}</div><div class="d">${esc(x.cat || "")} · ${br(x.venc)} · <b class="${s.k === "bad" ? "neg" : ""}">${s.t}</b></div></div>
  <div style="text-align:right;white-space:nowrap"><b>${fmt(x.valor)}</b><button class="x" data-del="${esc(x.id)}" aria-label="Excluir">×</button></div></div>`;
        });
        return h + "</div></div>";
      }

      function vExtrato() {
        const hoje = iso(new Date()),
          mes = hoje.slice(0, 7);
        const ms = by("mov")
          .filter((m) => per === "t" || m.date.slice(0, 7) === mes)
          .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
        const e = sum(
            ms.filter((m) => m.tipo === "entrada"),
            "valor",
          ),
          s = sum(
            ms.filter((m) => m.tipo === "saida"),
            "valor",
          );
        const g = {};
        ms.filter((m) => m.tipo === "saida").forEach((m) => {
          g[m.cat || "Outras"] = (g[m.cat || "Outras"] || 0) + (+m.valor || 0);
        });
        const gl = Object.entries(g).sort((a, b) => b[1] - a[1]),
          mx = gl.length ? gl[0][1] : 1;
        let h = `<div class="g12"><div class="s4 o2"><div class="chips" style="margin:0 0 12px"><button class="chip ${per === "m" ? "on" : ""}" data-p="m">Este mês</button><button class="chip ${per === "t" ? "on" : ""}" data-p="t">Tudo</button></div>
  <div class="g2 gap"><div class="card"><div class="k">Entradas</div><div class="v pos">${fm0(e)}</div></div><div class="card"><div class="k">Saídas</div><div class="v neg">${fm0(s)}</div></div></div>`;
        if (gl.length)
          h += `<div class="card"><div class="k">Para onde foi o dinheiro</div>${gl
            .slice(0, 6)
            .map(
              ([k, v]) =>
                `<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:13.5px;font-weight:600"><span>${esc(k)}</span><span>${fm0(v)}</span></div><div class="bar" style="margin-top:5px"><i style="width:${(v / mx) * 100}%;background:var(--bad)"></i></div></div>`,
            )
            .join("")}</div>`;
        h += `</div><div class="s8"><div class="card"><div class="k">Movimentações</div>`;
        if (!ms.length)
          h += `<div class="empty"><div class="e">📒</div>Nada lançado. Use o botão + para anotar.</div>`;
        ms.forEach((m) => {
          const en = m.tipo === "entrada";
          h += `<div class="row"><div><div class="t">${esc(m.cat || "")}</div><div class="d">${br(m.date)} · ${WD[new Date(m.date + "T00:00:00").getDay()]}${m.desc ? " · " + esc(m.desc) : ""}</div></div><div style="display:flex;align-items:center;gap:2px"><b class="${en ? "pos" : "neg"}">${en ? "+" : "−"}${fmt(m.valor)}</b><button class="x" data-del="${esc(m.id)}" aria-label="Excluir">×</button></div></div>`;
        });
        return h + "</div></div></div>";
      }

      function vAjustes() {
        const c = cfg(),
          chips = (t) =>
            cats(t)
              .map(
                (n, i) =>
                  `<span class="chip">${esc(n)} <button class="x" style="font-size:15px;padding:0 0 0 4px" data-rc="${t}|${i}">×</button></span>`,
              )
              .join("");
        return `<div class="g12"><div class="s6"><div class="card"><div class="k">Conta</div><div class="t" style="margin-top:6px">${esc(USER)}</div></div>
  <div class="card"><div class="k">Seu plano</div>
  <label>Saldo inicial (dinheiro que você já tem hoje)</label><input id="gx" type="number" value="${c.saldo0}">
  <label>Gastos do dia a dia que a meta deve cobrir (gasolina, comida… 0 se não quiser)</label><input id="gg" type="number" value="${c.gastoDia}">
  <label>Margem de segurança por dia</label><input id="gm" type="number" value="${c.margem}"><button class="btn" id="gs">Salvar</button></div></div>
  <div class="s6"><div class="card"><div class="k">Categorias de saída</div><div class="chips">${chips("saida")}</div><button class="btn g" data-ac="saida">＋ Nova categoria de saída</button>
  <div class="k" style="margin-top:18px">Categorias de entrada</div><div class="chips">${chips("entrada")}</div><button class="btn g" data-ac="entrada">＋ Nova categoria de entrada</button></div>
  <div class="card"><button class="btn g" style="margin-top:0" id="csv">Baixar planilha (CSV)</button><button class="btn g" id="out">Sair</button></div></div></div>`;
      }

      /* ---------- render ---------- */
      const V = {
        i: vInicio,
        c: vContas,
        l: vLancar,
        h: vExtrato,
        g: vAjustes,
      };
      function draw() {
        if (
          tab === "l" ||
          (tab === "g" &&
            document.activeElement &&
            document.activeElement.tagName === "INPUT")
        )
          return;
        $("#view").innerHTML = V[tab]();
        const n = calc().over.length;
        document.title = (n ? "(" + n + ") " : "") + "Controle Financeiro";
      }
      function go(t) {
        tab = t;
        document
          .querySelectorAll("#nav button")
          .forEach((b) => b.classList.toggle("on", b.dataset.t === t));
        $("#view").innerHTML = V[t]();
        scrollTo({ top: 0 });
        const n = calc().over.length;
        document.title = (n ? "(" + n + ") " : "") + "Controle Financeiro";
      }
      document
        .querySelectorAll("#nav button")
        .forEach((b) => (b.onclick = () => go(b.dataset.t)));

      function pay(id) {
        const x = items.find((i) => i.id === id),
          o = Object.assign({}, x);
        delete o.id;
        const hoje = iso(new Date());
        if (!x.pago) {
          o.pago = true;
          o.pagoEm = hoje;
          save(id, o);
          save("p" + id, {
            type: "mov",
            tipo: "saida",
            valor: +x.valor,
            date: hoje,
            cat: x.cat || "🧾 Outras contas",
            desc: x.nome,
            ref: id,
          });
          toast("Pago! Saída lançada no extrato ✅");
        } else {
          o.pago = false;
          delete o.pagoEm;
          save(id, o);
          del("p" + id);
          toast("Pagamento desfeito");
        }
      }
      const view = $("#view");
      view.addEventListener("change", (e) => {
        const s = e.target;
        if (s.tagName !== "SELECT" || s.value !== "__new") return;
        const t = s.dataset.t,
          n = addCat(t);
        s.innerHTML = opts(t, n || cats(t)[0]);
      });
      view.addEventListener("click", (e) => {
        const g = e.target.closest("[data-go]");
        if (g && !e.target.closest("button")) {
          go(g.dataset.go);
          return;
        }
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.tipo) {
          const v = $("#mv").value;
          tipo = b.dataset.tipo;
          go("l");
          $("#mv").value = v;
          return;
        }
        if (b.dataset.f) {
          filtro = b.dataset.f;
          draw();
          return;
        }
        if (b.dataset.p) {
          per = b.dataset.p;
          draw();
          return;
        }
        if (b.dataset.pay) {
          pay(b.dataset.pay);
          return;
        }
        if (b.dataset.del) {
          if (confirm("Excluir este item?")) {
            const x = items.find((i) => i.id === b.dataset.del);
            if (x && x.type === "conta") del("p" + x.id);
            del(b.dataset.del);
          }
          return;
        }
        if (b.dataset.ac) {
          const t = b.dataset.ac,
            n = addCat(t);
          if (n) toast("Categoria adicionada");
          return;
        }
        if (b.dataset.rc) {
          const [t, i] = b.dataset.rc.split("|"),
            l = cats(t).slice();
          l.splice(+i, 1);
          saveCfg(t === "entrada" ? { catsIn: l } : { catsOut: l });
          return;
        }
        switch (b.id) {
          case "ls": {
            const v = +$("#mv").value;
            if (!(v > 0)) {
              toast("Informe o valor");
              return;
            }
            save(uid(), {
              type: "mov",
              tipo,
              valor: v,
              date: $("#mdt").value || iso(new Date()),
              cat: $("#mc").value,
              desc: $("#md").value.trim(),
            });
            toast(tipo === "entrada" ? "Entrada salva 💰" : "Saída salva");
            go("i");
            break;
          }
          case "tf":
            showForm = !showForm;
            draw();
            break;
          case "ca": {
            const n = $("#cn").value.trim(),
              v = +$("#cv").value,
              d = $("#cd").value,
              k = Math.max(1, Math.min(60, +$("#cx").value || 1)),
              c = $("#cc").value;
            if (!n || !v || !d) {
              toast("Preencha nome, valor e vencimento");
              return;
            }
            for (let i = 0; i < k; i++)
              save(uid(), {
                type: "conta",
                nome: k > 1 ? `${n} (${i + 1}/${k})` : n,
                valor: v,
                venc: addMonths(d, i),
                cat: c,
                pago: false,
              });
            showForm = false;
            draw();
            toast(k > 1 ? k + " meses adicionados" : "Conta adicionada");
            break;
          }
          case "gs":
            saveCfg({
              saldo0: +$("#gx").value || 0,
              gastoDia: +$("#gg").value || 0,
              margem: +$("#gm").value || 0,
            });
            toast("Salvo");
            go("i");
            break;
          case "csv":
            exportCsv();
            break;
          case "out":
            logout("");
            break;
        }
      });
      function exportCsv() {
        const r = ["tipo;data;categoria;descricao;valor;pago"];
        by("mov")
          .sort((a, b) => (a.date < b.date ? -1 : 1))
          .forEach((m) =>
            r.push(
              `${m.tipo};${m.date};${m.cat || ""};${String(m.desc || "").replace(/;/g, ",")};${m.valor};`,
            ),
          );
        by("conta")
          .sort((a, b) => (a.venc < b.venc ? -1 : 1))
          .forEach((x) =>
            r.push(
              `conta;${x.venc};${x.cat || ""};${String(x.nome).replace(/;/g, ",")};${x.valor};${x.pago ? "sim" : "nao"}`,
            ),
          );
        const a = document.createElement("a");
        a.href = URL.createObjectURL(
          new Blob(["\ufeff" + r.join("\n")], { type: "text/csv" }),
        );
        a.download = "controle-financeiro.csv";
        a.click();
      }

      /* ---------- tema, auth, início ---------- */
      $("#theme").onclick = () => {
        const dark = document.documentElement.dataset.theme
          ? document.documentElement.dataset.theme === "dark"
          : matchMedia("(prefers-color-scheme:dark)").matches;
        const t = dark ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        try {
          localStorage.setItem("ctrl_theme", t);
        } catch (e) {}
      };
      try {
        const t = localStorage.getItem("ctrl_theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}

      function logout(msg) {
        TOKEN = null;
        USER = "";
        items = [];
        try {
          localStorage.removeItem(TK);
        } catch (e) {}
        $("#app").classList.add("hide");
        $("#login").classList.remove("hide");
        $("#err").textContent = msg || "";
      }
      function start() {
        $("#login").classList.add("hide");
        $("#app").classList.remove("hide");
        const h = new Date().getHours(),
          n = new Date();
        $("#dt").textContent =
          WD[n.getDay()] +
          ", " +
          n.toLocaleDateString("pt-BR", { day: "numeric", month: "long" });
        $("#hi").textContent =
          (h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite") + " 👋";
        go("i");
        Promise.all([api("GET", "me"), api("GET", "items")])
          .then(([u, r]) => {
            USER = u.name;
            items = r;
            $("#hi").textContent =
              (h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite") +
              ", " +
              u.name.split(" ")[0] +
              " 👋";
            draw();
            const o = calc().over.length;
            if (o)
              toast(
                "⚠️ " + o + (o === 1 ? " conta atrasada" : " contas atrasadas"),
              );
          })
          .catch(() => toast("Não consegui carregar seus dados."));
      }
      function setModo(m) {
        modo = m;
        $("#nmw").classList.toggle("hide", m === "login");
        $("#enter").textContent =
          m === "login" ? "Entrar" : "Criar minha conta";
        $("#sw").innerHTML =
          m === "login"
            ? "Ainda não tem conta? <b>Criar agora</b>"
            : "Já tem conta? <b>Entrar</b>";
        $("#err").textContent = "";
      }
      $("#sw").onclick = () => setModo(modo === "login" ? "cad" : "login");
      async function enter() {
        const b = $("#enter"),
          t = b.textContent;
        b.textContent = "Aguarde…";
        b.disabled = true;
        $("#err").textContent = "";
        try {
          const body = { email: $("#em").value, password: $("#pw").value };
          if (modo === "cad") body.name = $("#nm").value;
          const r = await api(
            "POST",
            modo === "login" ? "login" : "register",
            body,
          );
          TOKEN = r.token;
          USER = r.name;
          try {
            localStorage.setItem(TK, TOKEN);
          } catch (e) {}
          $("#pw").value = "";
          start();
        } catch (e) {
          $("#err").textContent =
            e.msg ||
            "Não consegui falar com o servidor. Abra pelo endereço http://localhost/controle-financeiro/";
        }
        b.textContent = t;
        b.disabled = false;
      }
      $("#enter").onclick = enter;
      $("#pw").onkeydown = (e) => {
        if (e.key === "Enter") enter();
      };
      $("#eye").onclick = () => {
        const p = $("#pw"),
          s = p.type === "password";
        p.type = s ? "text" : "password";
        $("#eye").textContent = s ? "ocultar" : "mostrar";
      };
      let wide = innerWidth >= 1280;
      addEventListener("resize", () => {
        const w = innerWidth >= 1280;
        if (w !== wide) {
          wide = w;
          if (!$("#app").classList.contains("hide")) draw();
        }
      });
      try {
        TOKEN = localStorage.getItem(TK);
      } catch (e) {}
      if (TOKEN) start();
      else $("#login").classList.remove("hide");
    </script>
  </body>
</html>
